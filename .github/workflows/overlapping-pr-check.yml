name: Overlapping PR check

# Flags a pull request that edits files another open pull request is already
# editing.
#
# Several agents are dispatched against this repository independently and none
# of them can see what the others are doing, so they land on the same target
# regularly. One sweep produced three byte-identical pull requests renaming the
# same import, three separate takes on splitting one function, and three sets of
# tests for one endpoint — eleven of thirty rejected pull requests were
# duplicates of another open one.
#
# Nothing here blocks a merge: overlap is normal on a busy branch and only the
# author can judge whether two pull requests are really the same work. This just
# surfaces it at open time, on the pull request, rather than leaving it to be
# discovered in review.
#
# The comment is rewritten in place on each push, so a pull request carries at
# most one of these and it always reflects the current diff.
#
# Open pull requests and their file lists are read in ONE GraphQL query rather
# than a REST listFiles call per pull request. That matters here: these repos
# see bursts of twenty or thirty agent pull requests within a few minutes, and
# the REST shape would spend ~N calls per event against GITHUB_TOKEN's limit of
# 1000 requests per hour per repository — exhausting it during exactly the burst
# this check exists to catch. GraphQL bills this as a handful of points against
# a far larger budget.
#
# Only the 50 most recently updated open pull requests are compared, and at most
# 100 files each. Both bounds are far above what these repositories carry; a
# pull request past either edge is simply not compared, never wrongly flagged.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  overlapping-pr-check:
    name: Check for overlapping open pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Compare changed files against other open pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- overlapping-pr-check -->';
            const { owner, repo } = context.repo;
            const self = context.payload.pull_request.number;

            const query = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  pullRequests(
                    states: OPEN
                    first: 50
                    orderBy: { field: UPDATED_AT, direction: DESC }
                  ) {
                    nodes {
                      number
                      title
                      isDraft
                      files(first: 100) { nodes { path } }
                    }
                  }
                }
              }`;

            const data = await github.graphql(query, { owner, repo });
            const prs = data.repository.pullRequests.nodes;

            const pathsOf = (pr) => new Set((pr.files?.nodes ?? []).map((f) => f.path));

            const me = prs.find((pr) => pr.number === self);
            if (!me) {
              core.info(`#${self} is outside the 50 most recently updated open PRs; skipping.`);
              return;
            }
            const mine = pathsOf(me);

            const overlaps = [];
            for (const pr of prs) {
              if (pr.number === self || pr.isDraft) continue;
              const theirs = pathsOf(pr);
              const shared = [...mine].filter((p) => theirs.has(p));
              if (shared.length) overlaps.push({ pr, shared });
            }

            // Find any comment this job left earlier so it can be updated in place.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: self, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(MARKER),
            );

            if (!overlaps.length) {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner, repo, comment_id: existing.id,
                });
              }
              core.info('No overlap with other open pull requests.');
              return;
            }

            overlaps.sort((a, b) => b.shared.length - a.shared.length);

            const lines = [
              MARKER,
              '### Overlaps other open pull requests',
              '',
              'These open pull requests edit files this one also edits. That is often fine — but where two of them are doing the same work, closing the weaker one now is cheaper than reconciling them after both are reviewed.',
              '',
            ];

            for (const { pr, shared } of overlaps) {
              const shown = shared.slice(0, 10).map((p) => `\`${p}\``).join(', ');
              const more = shared.length > 10 ? ` _(+${shared.length - 10} more)_` : '';
              lines.push(`- #${pr.number} — ${pr.title}`);
              lines.push(`  - ${shown}${more}`);
            }

            lines.push('');
            lines.push('_Updated on each push; removed automatically once the overlap is gone._');

            const body = lines.join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: self, body,
              });
            }

            core.notice(
              `Overlaps ${overlaps.length} open pull request(s): ` +
              overlaps.map((o) => `#${o.pr.number}`).join(', '),
            );
