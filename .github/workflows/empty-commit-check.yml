name: Empty Commit Check

# Gate that rejects changes containing nothing to build or test.
#
# Every non-agent workflow in this repository declares its first job as
#   needs: empty-commit-check
# so that when this gate fails the remaining jobs are skipped rather than run.
#
# It is called only by those workflows - it has no trigger of its own. An
# earlier version also ran standalone on every pull request, which guaranteed a
# check even where the other workflows are path-filtered, but it meant the gate
# reported twice on every pull request. The duplicate line was not worth it.
#
# A change is rejected when its overall diff against the base (or the previous
# commit, on a push) touches no files.
#
# Individual commits are deliberately NOT inspected. An agent that pushes an
# empty commit and then a follow-up carrying the real change produces a branch
# that is perfectly fine as a whole, and failing it helps nobody - the tidying
# belongs in review, not in a gate that blocks CI.
#
# Events that carry no commit range (workflow_dispatch, release, new tags)
# are skipped rather than failed, so manual and tag-driven releases still run.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  empty-commit-check:
    name: Reject empty commits
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail when the change is empty
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          ZERO=0000000000000000000000000000000000000000

          skip() { echo "::notice title=Empty commit check skipped::$1"; exit 0; }

          fetch_branch() {
            [ -n "${1:-}" ] || return 0
            git fetch --no-tags --quiet origin "+refs/heads/$1:refs/remotes/origin/$1" 2>/dev/null || true
          }

          base_from_default() {
            fetch_branch "$DEFAULT_BRANCH"
            git merge-base "origin/$DEFAULT_BRANCH" "$1" 2>/dev/null || true
          }

          case "$EVENT_NAME" in
            pull_request|pull_request_target)
              [ -n "${PR_BASE_REF:-}" ] && [ -n "${PR_HEAD_SHA:-}" ] \
                || skip "Pull request payload carried no base/head refs."
              fetch_branch "$PR_BASE_REF"
              HEAD_SHA="$PR_HEAD_SHA"
              BASE_SHA="$(git merge-base "origin/$PR_BASE_REF" "$PR_HEAD_SHA" 2>/dev/null || true)"
              [ -n "$BASE_SHA" ] \
                || skip "No merge base between origin/$PR_BASE_REF and $PR_HEAD_SHA."
              ;;
            push)
              HEAD_SHA="${PUSH_AFTER:-$GITHUB_SHA}"
              if [ -z "${PUSH_BEFORE:-}" ] || [ "$PUSH_BEFORE" = "$ZERO" ]; then
                BASE_SHA="$(base_from_default "$HEAD_SHA")"
                { [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "$HEAD_SHA" ]; } \
                  || skip "New ref with no commits beyond $DEFAULT_BRANCH."
              elif git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                BASE_SHA="$PUSH_BEFORE"
              else
                echo "Previous commit $PUSH_BEFORE is unavailable (likely a force-push);" \
                     "falling back to the merge base with $DEFAULT_BRANCH."
                BASE_SHA="$(base_from_default "$HEAD_SHA")"
                { [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "$HEAD_SHA" ]; } \
                  || skip "No usable commit range after force-push fallback."
              fi
              ;;
            *)
              skip "Event '$EVENT_NAME' carries no commit range."
              ;;
          esac

          if [ "$BASE_SHA" = "$HEAD_SHA" ]; then
            skip "Base and head are the same commit ($HEAD_SHA); no new work to inspect."
          fi

          echo "Inspecting range ${BASE_SHA}..${HEAD_SHA}"
          echo

          # The change as a whole must touch at least one file.
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" --; then
            echo "::error title=Empty change::${BASE_SHA}..${HEAD_SHA} modifies no files. There is nothing to build or test."
            exit 1
          fi

          echo "Files changed overall:"
          git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- | sed 's/^/  /'
          echo

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- | wc -l | tr -d ' ')"
          total="$(git rev-list --count "${BASE_SHA}..${HEAD_SHA}")"
          echo "OK: ${total} commit(s) in range changing ${changed} file(s)."
